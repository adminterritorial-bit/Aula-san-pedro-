name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Frontend regression tests
        run: |
          node tests/verify-municipal.mjs
          node tests/auth-regression.mjs
      - name: Prepare only public files
        run: |
          mkdir -p publish
          cp index.html 404.html favicon.svg manifest.webmanifest styles.css aula-premium.css sw.js .nojekyll publish/
          cp -R js publish/js
          if find publish -type f | grep -E '(^|/)(database-reference|supabase|modern|\.github)/'; then
            echo 'Unexpected internal assets in public deploy'
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
